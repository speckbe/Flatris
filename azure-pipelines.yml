# Node.js with React
# Build a Node.js project that uses React.

trigger:
- master

pool:
  vmImage: ubuntu-latest

stages:

- stage: Build
  displayName: Build

  jobs:
  - job: BuildJob
    displayName: Build Javascript Application

    steps:

    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'

    - script: npm install
      displayName: 'Install dependencies'

    - script: npm run build
      displayName: 'Build application'

    - script: |
        echo "Files after build:"
        find ./docs -maxdepth 3 -type f | sort
      displayName: 'Show build output'

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: 'docs'
        artifact: 'webapp'
      displayName: 'Publish web application'


- stage: Deploy
  displayName: 'Deploy to Azure Static Web App'
  dependsOn: Build

  jobs:
  - job: DeployJob
    displayName: 'Deploy Web Application'

    steps:

    - download: current
      artifact: webapp
      displayName: 'Download webapp artifact'

    - script: |
        echo "Downloaded files:"
        find "$(Pipeline.Workspace)/webapp" -maxdepth 3 -type f | sort
      displayName: 'Verify deployment files'

    - task: AzureStaticWebApp@0
      displayName: 'Deploy to Azure Static Web App'
      inputs:
        app_location: '$(Pipeline.Workspace)/webapp'
        output_location: ''
        skip_app_build: true
        skip_api_build: true
        azure_static_web_apps_api_token: $(deployment_token)